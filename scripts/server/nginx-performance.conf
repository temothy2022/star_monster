# Star Monsters static delivery defaults.
# Install once at /etc/nginx/conf.d/star-monsters-performance.conf.
#
# This file is included from nginx's `http` context, so it works with the
# child site's root and the parent/super-admin alias locations alike.

# Ubuntu's default nginx.conf already enables gzip.
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1k;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;

# Vite fingerprints production assets in their file names. They can be cached
# for a year, while HTML and API responses retain their existing cache policy.
map $sent_http_content_type $star_monsters_static_expires {
  default off;
  ~^application/javascript 365d;
  ~^text/css 365d;
  ~^image/ 365d;
  ~^font/ 365d;
}

expires $star_monsters_static_expires;
